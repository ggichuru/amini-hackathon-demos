<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shamba Steward - Gemini Taskmaster</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #121212;
            color: #C9CCD1;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #FFC83C;
            margin-bottom: 10px;
        }
        .tagline {
            font-size: 1.1em;
            opacity: 0.8;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #1b1b1b;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            color: #C9CCD1;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #FFC83C;
        }
        textarea {
            height: 150px;
            resize: vertical;
        }
        button {
            background-color: #FFC83C;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .step-container {
            margin-bottom: 25px;
            padding: 20px;
            background-color: #1b1b1b;
            border-radius: 6px;
            border: 1px solid #2a2a2a;
        }
        .step-title {
            color: #FFC83C;
            margin-top: 0;
            margin-bottom: 15px;
        }
        .step-content {
            margin-bottom: 15px;
        }
        .violation-alert {
            background-color: #1b1b1b;
            border-left: 4px solid #FFC83C;
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 4px 4px 0;
        }
        .success-message {
            color: #4CAF50;
            font-weight: 500;
        }
        .download-btn {
            background-color: #FFC83C;
            color: #121212;
            padding: 12px 20px;
            margin-top: 15px;
            text-decoration: none;
            display: inline-block;
            border-radius: 4px;
        }
        .copy-btn {
            background-color: #FFC83C;
            color: #121212;
            padding: 8px 16px;
            margin-left: 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .agent-stepper {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        .agent-stepper::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #2a2a2a;
            z-index: 1;
        }
        .step-indicator {
            text-align: center;
            z-index: 2;
            position: relative;
        }
        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
        }
        .step-indicator.active .step-number {
            background-color: #FFC83C;
            color: #121212;
        }
        .step-label {
            font-size: 0.9em;
            opacity: 0.7;
        }
        .step-indicator.active .step-label {
            opacity: 1;
            font-weight: 500;
        }
        .hidden {
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a2a2a;
        }
        th {
            background-color: #1b1b1b;
        }
        .key-hint {
            font-size: 0.85em;
            opacity: 0.7;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Shamba Steward</h1>
            <p class="tagline">Type one messy field note. Get a verified action plan.</p>
        </header>
        
        <div class="form-group">
            <label for="api-key">Gemini API Key:</label>
            <input type="password" id="api-key" placeholder="Enter your Gemini API key">
            <div class="key-hint">stored in your browser only; used directly against Google, never sent to us</div>
        </div>
        
        <div class="form-group">
            <label for="model-select">Gemini Model:</label>
            <select id="model-select">
                <option value="gemini-2.0-flash">gemini-2.0-flash</option>
                <option value="gemini-1.5-flash">gemini-1.5-flash</option>
                <option value="gemini-1.5-pro">gemini-1.5-pro</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="field-text">Field Update Text:</label>
            <textarea id="field-text" placeholder="Enter your field update text here...">North plot maize is tasseling. Aphids on the beans in the east plot. Rain expected Thursday. Need to sell 3 bags of maize.</textarea>
        </div>
        
        <button id="run-button">Run Agent</button>
        
        <div id="agent-stepper" class="agent-stepper hidden">
            <div class="step-indicator active" id="step-parse">
                <div class="step-number">1</div>
                <div class="step-label">Parse</div>
            </div>
            <div class="step-indicator" id="step-plan">
                <div class="step-number">2</div>
                <div class="step-label">Plan</div>
            </div>
            <div class="step-indicator" id="step-verify">
                <div class="step-number">3</div>
                <div class="step-label">Verify</div>
            </div>
            <div class="step-indicator" id="step-deliver">
                <div class="step-number">4</div>
                <div class="step-label">Deliver</div>
            </div>
        </div>
        
        <div id="output-container">
            <div id="parse-output" class="step-container hidden">
                <h2 class="step-title">Step 1: Parse</h2>
                <div id="parse-content" class="step-content"></div>
            </div>
            
            <div id="plan-output" class="step-container hidden">
                <h2 class="step-title">Step 2: Plan</h2>
                <div id="plan-content" class="step-content"></div>
            </div>
            
            <div id="verify-output" class="step-container hidden">
                <h2 class="step-title">Step 3: Verify</h2>
                <div id="verify-content" class="step-content"></div>
            </div>
            
            <div id="deliver-output" class="step-container hidden">
                <h2 class="step-title">Step 4: Deliver</h2>
                <div id="deliver-content" class="step-content"></div>
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
